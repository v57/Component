<!-- Toggles in ComponentKit-Controls.md: a checkbox, chips on a ChipTrack, KitHuePicker. -->
<div class="ck-card ck-stack" style="width: 290px">
  <label class="ck-check"><input type="checkbox" data-ck-bind="remote" checked>Show Remote Branches</label>
  <div class="ck-chips" role="group" aria-label="Languages">
    <button class="ck-chip-toggle" data-ck-bind="english" aria-pressed="true">English</button>
    <button class="ck-chip-toggle" data-ck-bind="german" aria-pressed="false">German</button>
  </div>
  <div class="ck-hues" data-ck-bind="tag" data-ck-value="orange" aria-label="Tag colour">
    <button class="h-red" data-value="red"></button><button class="h-orange" data-value="orange"></button><button class="h-yellow" data-value="yellow"></button><button class="h-green" data-value="green"></button><button class="h-teal" data-value="teal"></button><button class="h-blue" data-value="blue"></button><button class="h-indigo" data-value="indigo"></button><button class="h-purple" data-value="purple"></button><button class="h-pink" data-value="pink"></button><button class="h-brown" data-value="brown"></button><button class="h-gray" data-value="gray"></button>
  </div>
</div>
