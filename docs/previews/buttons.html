<!-- Buttons in ComponentKit-Controls.md: .kit, destructive, .kitPrimary, .kitPlain, .kitIcon, KitCopyButton. -->
<div class="ck-card ck-stack" style="width: 290px">
  <div class="ck-hstack">
    <button class="ck-btn" data-ck-action="cancel">Cancel</button>
    <button class="ck-btn destructive" data-ck-action="discard">Discard</button>
    <button class="ck-btn primary" data-ck-action="clone">Clone</button>
  </div>
  <div class="ck-hstack">
    <button class="ck-btn plain" data-ck-action="show-all">Show All</button>
    <button class="ck-btn icon" data-ck-action="add" aria-label="Add">Add<i data-icon="plus"></i></button>
    <button class="ck-btn" data-ck-action="copy" data-ck-copied>Copy Code</button>
  </div>
  <div class="ck-hstack">
    <button class="ck-btn sm">Small</button>
    <button class="ck-btn">Regular</button>
    <button class="ck-btn lg">Large</button>
    <button class="ck-btn primary" disabled>Off</button>
  </div>
</div>
