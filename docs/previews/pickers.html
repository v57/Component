<!-- Pickers, sliders and steppers in ComponentKit-Controls.md: KitPicker, KitSlider and KitStepper in FormRows. -->
<div class="ck-card panel" style="width: 300px; padding: 8px">
  <div class="ck-formcard">
    <div class="ck-form-row"><span class="ck-tile"><i data-icon="eye"></i></span><span class="text">Appearance</span>
      <div class="ck-popup" data-ck-bind="theme" data-ck-options="system:System,light:Light,dark:Dark" data-ck-value="system"></div></div>
    <div class="ck-form-row"><span class="ck-tile"><i data-icon="globe"></i></span><span class="text">Volume</span>
      <div class="ck-slider" data-ck-bind="volume" data-min="0" data-max="1" data-step="0.01" data-value="0.6" data-format="percent" aria-label="Volume" style="flex: 0 1 120px; min-width: 96px"></div></div>
    <div class="ck-form-row"><span class="ck-tile"><i data-icon="pencil"></i></span><span class="text">Font Size</span>
      <div class="ck-stepper" data-ck-bind="fontSize" data-min="9" data-max="24" data-step="1" data-value="13" data-unit="pt" aria-label="Font Size"></div></div>
  </div>
</div>
